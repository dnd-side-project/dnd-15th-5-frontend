name: 🔧 Chore
description: Chore 이슈를 생성합니다. 모듈, 빌드, CI/CD 이슈 템플릿입니다.
title: '[🔧 Chore] '
labels:
  - '🔧 Chore'
body:
  - type: input
    id: parentKey
    attributes:
      label: '🎟️ 작업 종류 (Feature Type)'
      description: 작업 종류의 Jira Ticket Number를 기입해주세요
      value: KAN-3
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: '📌 설명'
      description: 무슨 기능을 어떤 이유로 구현하는지 작성해주세요.
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: '🛠️ 구현 목록 (TODO)'
      description: 진행할 작업을 체크리스트로 작성해주세요.
      value: |
        - [ ] Task1
        - [ ] Task2
    validations:
      required: true

  - type: textarea
    id: reference
    attributes:
      label: '✅ 참고'
      description: 관련 문서, Issue 등을 첨부하거나 작성해주세요.
