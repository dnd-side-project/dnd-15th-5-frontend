name: ✨ Feature
description: Feature 이슈를 생성합니다. 기능 추가 이슈 템플릿입니다.
title: '[✨ Feature] '
labels:
  - '✨ Feature'
body:
  - type: input
    id: parentKey
    attributes:
      label: '🎟️ 작업 종류 (Feature Type)'
      description: 작업 종류의 Jira Ticket Number를 기입해주세요
      value: KAN-3
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: '📌 설명'
      description: 무슨 기능을 어떤 이유로 구현하는지 작성해주세요.
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: '🛠️ 구현 목록 (TODO)'
      description: 진행할 작업을 체크리스트로 작성해주세요.
      value: |
        - [ ] Task1
        - [ ] Task2
    validations:
      required: true

  - type: textarea
    id: reference
    attributes:
      label: '✅ 예상 화면'
      description: 디자인 시안을 첨부해주세요.
