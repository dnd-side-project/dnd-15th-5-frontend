name: "Chromatic-Storybook Deployment"

on:
  pull_request:
    branches: ["develop", feat/**, refactor/**, fix/**, chore/**]

jobs:
  chromatic-deploy:
    if: ${{ !github.event.pull_request.head.repo.fork }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish to Chromatic
        id: chromatic
        uses: chromaui/action@latest
        with:
          exitZeroOnChanges: true
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Record deployment time
        id: deployment-time
        run: echo "timestamp=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Comment PR with Storybook link
        uses: thollander/actions-comment-pull-request@v3
        with:
          comment-tag: chromatic-storybook
          message: |
            🎨 **스토리북 배포 링크 확인**

            - 🔗 Preview: ${{ steps.chromatic.outputs.storybookUrl }}
            - 🕒 배포 일시: <t:${{ steps.deployment-time.outputs.timestamp }}:F>
